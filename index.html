<meta charset="UTF-8">

<title>Roland-Morris 背部功能評估工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;
  background:#cbd3da; /* 溫和不刺眼的莫蘭迪藍灰色 */
  color:#1c2833;      /* 深藍黑墨水色文字，對比清晰 */
  overflow-x:hidden;
}
/* ── Speech unlock overlay ── */
#speech-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(28,40,51,0.97);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:1000;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#speech-overlay .tap-icon{
  font-size:6rem;margin-bottom:1.5rem;
  animation:pulse 1.4s ease-in-out infinite;
}
#speech-overlay .tap-text{font-size:2.8rem;font-weight:bold;text-align:center;padding:0 1rem;color:#fff;}
#speech-overlay .tap-sub{font-size:1.3rem;margin-top:.8rem;opacity:.7;color:#fff;}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.18);opacity:.65}
}
/* ── No-speech banner ── */
#no-speech-banner{
  display:none;position:fixed;top:0;left:0;right:0;
  background:#e74c3c;color:#fff;text-align:center;
  padding:.7rem;font-size:1.2rem;z-index:500;
}
/* ── App container ── */
#app{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:1rem .7rem 2rem;
}
/* ── Header ── */
.header-title{font-size:1.8rem;font-weight:bold;text-align:center;margin-top:.4rem;color:#1c2833;}
.header-sub{font-size:1.1rem;text-align:center;opacity:.85;margin-top:.2rem;margin-bottom:.8rem;color:#34495e;}
/* ── Progress ── */
#progress-area{width:100%;max-width:700px;margin-bottom:1rem;}
#progress-text{font-size:1.6rem;font-weight:bold;text-align:center;margin-bottom:.5rem;color:#1c2833;}
#progress-bar-bg{width:100%;height:14px;background:#b0bcc6;border-radius:7px;overflow:hidden;}
#progress-bar-fill{height:100%;width:0;background:#1c2833;border-radius:7px;transition:width .4s ease;}
/* ── Question card ── */
#question-card{
  background:#fff;color:#222;border-radius:16px;
  padding:1.8rem 1.4rem 1.2rem;
  width:100%;max-width:700px;text-align:center;
  box-shadow:0 6px 20px rgba(44,62,80,.12);
  border: 2px solid #95a5a6;
  margin-bottom:1.5rem;
}
#question-number{font-size:1.3rem;color:#555;margin-bottom:.5rem;font-weight:bold;}
#question-text{font-size:2.1rem;font-weight:bold;line-height:1.7;color:#111;}
/* ── Button row ── */
.btn-row{
  display:flex;justify-content:center;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap;
}
.card-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.6rem 1.8rem;
  background:#e5eaee;color:#2c3e50;border:1px solid #7f8c8d;border-radius:25px;
  font-size:1.3rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:hover{background:#d5dbdb;}
/* ── Answers area ── */
#answers-area{
  width:100%;max-width:700px;
  display:grid;grid-template-columns:1fr;gap:.9rem;
}
/* ── Answer buttons ── */
.answer-btn{
  border:none;border-radius:14px;
  padding:1.5rem 1rem;
  font-size:2.1rem;font-weight:bold;
  color:#fff;cursor:pointer;
  transition:transform .15s,opacity .15s,box-shadow .3s,filter .3s;
  box-shadow:0 5px 0 rgba(0,0,0,.22);
  text-align:center;user-select:none;
  -webkit-tap-highlight-color:transparent;
  min-height:4.8rem;
  display:flex;align-items:center;justify-content:center;
  gap:0.8rem;position:relative;
}
.answer-btn:active:not(.locked){transform:scale(.96);}
.answer-btn.locked{pointer-events:none;opacity:.25;filter:grayscale(.6);}
.answer-btn.selected{
  transform:scale(1.04);opacity:1!important;filter:none!important;
  box-shadow:0 0 0 6px #1c2833,0 5px 0 rgba(0,0,0,.22);
}
.answer-btn.glow{
  animation:glowPulse .7s ease-in-out infinite alternate;
  z-index:10;transform:scale(1.04);
}
@keyframes glowPulse{
  0%{
    box-shadow:0 0 12px rgba(28,40,51,0.4),0 0 24px rgba(28,40,51,0.2),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.1);
  }
  100%{
    box-shadow:0 0 20px rgba(28,40,51,0.7),0 0 40px rgba(28,40,51,0.3),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.25);
  }
}
.clr-red{background:#ba1c31;}
.clr-blue{background:#1a5276;}
.btn-emoji{font-size:2.6rem;line-height:1;}
/* ── Result screen ── */
#result-screen{display:none;width:100%;max-width:700px;text-align:center;}
.result-card{
  background:#fff;color:#222;border-radius:16px;
  padding:2.2rem 1.6rem;
  box-shadow:0 6px 20px rgba(44,62,80,.12);
  border: 2px solid #95a5a6;
  margin-bottom:1.5rem;
}
.result-msg{font-size:1.7rem;line-height:1.9;margin-bottom:1.8rem;text-align:left;color:#222;}
.result-scores{font-size:2.6rem;font-weight:bold;color:#1c2833;}
.result-scores span{display:block;margin:.5rem 0;}
.result-credit{font-size:1.1rem;color:#566573;margin-top:1.4rem;}
#restart-btn{
  padding:1.2rem 3rem;background:#1c2833;color:#fff;
  border:none;border-radius:30px;font-size:1.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
#restart-btn:hover{background:#2e4053;}
#quiz-area{width:100%;display:flex;flex-direction:column;align-items:center;}
@media(min-width:600px){
  #question-text{font-size:2.5rem;}
  .answer-btn{font-size:2.3rem;padding:1.8rem 1.2rem;}
  .btn-emoji{font-size:3rem;}
  .result-msg{font-size:1.9rem;}
  .result-scores{font-size:3rem;}
}
</style>
</head>
<body>
<div id="speech-overlay">
  <div class="tap-icon">🔊</div>
  <div class="tap-text">點按以啟用語音</div>
  <div class="tap-sub">Tap to enable voice</div>
</div>
<div id="no-speech-banner">此瀏覽器不支援語音朗讀</div>
<div id="app">
  <div class="header-title">Roland-Morris 背部功能評估工具</div>
  <div class="header-sub">新界東醫院聯網 物理治療部</div>
  <div id="quiz-area">
    <div id="progress-area">
      <div id="progress-text"></div>
      <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>
    <div id="question-card">
      <div id="question-number"></div>
      <div id="question-text"></div>
      <div class="btn-row">
        <button class="card-btn" id="replay-btn">🔊 重播</button>
      </div>
    </div>
    <div id="answers-area"></div>
  </div>
  <div id="result-screen">
    <div class="result-card">
      <div class="result-msg" id="result-msg"></div>
      <div class="result-scores" id="result-scores"></div>
      <div class="result-credit">新界東醫院聯網 物理治療部製作</div>
    </div>
    <button id="restart-btn">🔄 重新開始</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  /* ═══════════════════ DATA ═══════════════════ */
  var questions = [
    { id:1, text:'因為背痛，我經常留在家中。' },
    { id:2, text:'我經常轉換姿勢，保持背部舒適。' },
    { id:3, text:'因為背部，我走得比平常慢。' }, /* 已成功修正第三題文字 */
    { id:4, text:'因為背部，我已停止做日常負責的家務。' },
    { id:5, text:'因為背部影響，我上樓梯時要利用扶手。' },
    { id:6, text:'因為背部影響，我比平常較多時間躺下休息。' },
    { id:7, text:'因為背部影響，我需要扶著東西才能從梳化站起來。' },
    { id:8, text:'因為背部影響，我嘗試請別人替我完成一些事情。' },
    { id:9, text:'因為背部影響，我穿衣比平常緩慢。' },
    { id:10, text:'因為背部影響，我只可站立一段短時間。' },
    { id:11, text:'因為背部影響，我避免彎腰或跪下。' },
    { id:12, text:'因為背部影響，我坐在椅子上很難才能站起。' },
    { id:13, text:'我的背部差不多每時每刻都痛楚。' },
    { id:14, text:'因為背部影響，睡在床上，很難轉身。' },
    { id:15, text:'因為背部影響，我的胃口不佳。' },
    { id:16, text:'因為背部影響，穿襪子或襪褲時會有困難。' },
    { id:17, text:'因為背痛，我只能走一段短距離。' },
    { id:18, text:'因為背部影響，我睡得不好。' },
    { id:19, text:'因為背痛，我需要別人協助穿衣服。' },
    { id:20, text:'因為背部影響，我每天大部份時間都是坐著。' },
    { id:21, text:'因為背部影響，我避免做家中粗重的工作。' },
    { id:22, text:'因為背痛，我的脾氣比平常差。' },
    { id:23, text:'因為背部影響，我上樓梯比平常緩慢。' },
    { id:24, text:'因為背部影響，我大部份時間睡在床上。' }
  ];

  /* ─── STATE ─── */
  var currentIndex = 0;
  var answers = [];
  var locked = false;
  var speechEnabled = false;
  var speechOK = ('speechSynthesis' in window);
  var repeatTimer = null;
  var speechSeqId = 0;

  /* ─── DOM REFS ─── */
  var elOverlay = document.getElementById('speech-overlay');
  var elBanner = document.getElementById('no-speech-banner');
  var elProgressTxt = document.getElementById('progress-text');
  var elProgressBar = document.getElementById('progress-bar-fill');
  var elQNum = document.getElementById('question-number');
  var elQText = document.getElementById('question-text');
  var elReplay = document.getElementById('replay-btn');
  var elAnswers = document.getElementById('answers-area');
  var elQuiz = document.getElementById('quiz-area');
  var elResult = document.getElementById('result-screen');
  var elResultMsg = document.getElementById('result-msg');
  var elResultScore = document.getElementById('result-scores');
  var elRestart = document.getElementById('restart-btn');

  /* ═══════════════════ VOICE SELECTION ═══════════════════ */
  function applyVoice(utter){
    var voices = window.speechSynthesis.getVoices();
    var zhHK = null, zhTW = null, zhAny = null;
    for(var i = 0; i < voices.length; i++){
      var lang = voices[i].lang || '';
      if(lang === 'zh-HK' && !zhHK) zhHK = voices[i];
      if(lang === 'zh-TW' && !zhTW) zhTW = voices[i];
      if(lang.indexOf('zh') === 0 && !zhAny) zhAny = voices[i];
    }
    utter.voice = zhHK || zhTW || zhAny || null;
    utter.lang = 'zh-HK';
    utter.rate = 0.85;
  }

  /* ─── HELPERS ─── */
  function clearAllGlow(){
    var btns = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < btns.length; i++) btns[i].classList.remove('glow');
  }

  /* ─── REPEAT TIMER (10 Seconds) ─── */
  function startRepeatTimer(){
    stopRepeatTimer();
    repeatTimer = setTimeout(function(){
      if(!locked){
        speakSequence();
      }
    }, 10000);
  }
  function stopRepeatTimer(){
    if(repeatTimer !== null){ clearTimeout(repeatTimer); repeatTimer = null; }
  }

  /* ─── SPEECH: SEQUENCE ─── */
  function speakSequence(){
    if(!speechOK || !speechEnabled) return;
    window.speechSynthesis.cancel();
    clearAllGlow();
    stopRepeatTimer();
    speechSeqId++;
    var mySeqId = speechSeqId;
    var q = questions[currentIndex];
    var items = [];
    items.push({ text: q.text, buttonIndex: -1 });
    var btns = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < btns.length; i++){
      items.push({ text: btns[i].getAttribute('data-speech'), buttonIndex: i });
    }
    var idx = 0;
    function speakNext(){
      if(mySeqId !== speechSeqId) return;
      if(idx >= items.length || locked){
        clearAllGlow();
        if(mySeqId === speechSeqId) startRepeatTimer();
        return;
      }
      var item = items[idx];
      var utter = new SpeechSynthesisUtterance(item.text);
      applyVoice(utter);
      utter.onstart = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        if(item.buttonIndex >= 0){
          var allBtns = elAnswers.querySelectorAll('.answer-btn');
          if(allBtns[item.buttonIndex]) allBtns[item.buttonIndex].classList.add('glow');
        }
      };
      utter.onend = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        idx++;
        setTimeout(speakNext, 400);
      };
      utter.onerror = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        idx++;
        setTimeout(speakNext, 400);
      };
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  }

  /* ─── SPEECH: RESULT ─── */
  function speakResult(totalScore){
    if(!speechOK || !speechEnabled) return;
    window.speechSynthesis.cancel();
    stopRepeatTimer();
    speechSeqId++;
    var mySeqId = speechSeqId;
    var lines = [
      '非常感謝您完成了這份調查中所有的問題。',
      '請勿關閉此頁面，並告知您的物理治療師。',
      '您的總計分數是 ' + totalScore + ' 分。'
    ];
    var idx = 0;
    function speakNext(){
      if(mySeqId !== speechSeqId) return;
      if(idx >= lines.length) return;
      var utter = new SpeechSynthesisUtterance(lines[idx]);
      applyVoice(utter);
      utter.onend = function(){
        if(mySeqId !== speechSeqId) return;
        idx++;
        setTimeout(speakNext, 400);
      };
      utter.onerror = function(){
        if(mySeqId !== speechSeqId) return;
        idx++;
        setTimeout(speakNext, 400);
      };
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  }

  /* ─── RENDER ─── */
  function renderQuestion(){
    locked = false;
    stopRepeatTimer();
    var q = questions[currentIndex];
    var totalQs = questions.length;
    elProgressTxt.textContent = '第 ' + (currentIndex + 1) + ' / ' + totalQs + ' 題';
    elProgressBar.style.width = ((currentIndex + 1) / totalQs * 100) + '%';
    elQNum.textContent = '問題 ' + (currentIndex + 1);
    elQText.textContent = q.text;
    elAnswers.innerHTML = '';
    
    addButton('✅', '同意', 1, 'clr-red');
    addButton('❌', '不同意', 0, 'clr-blue');
    
    window.scrollTo(0, 0);
    speakSequence();
  }

  function addButton(emoji, label, value, colorClass){
    var btn = document.createElement('button');
    btn.className = 'answer-btn ' + colorClass;
    if(emoji){
      var es = document.createElement('span');
      es.className = 'btn-emoji';
      es.textContent = emoji;
      btn.appendChild(es);
    }
    var ts = document.createElement('span');
    ts.textContent = label;
    btn.appendChild(ts);
    btn.setAttribute('data-speech', label);
    btn.addEventListener('click', function(){ onAnswer(btn, value); });
    elAnswers.appendChild(btn);
  }

  /* ─── ANSWER ─── */
  function onAnswer(btn, value){
    if(locked) return;
    locked = true;
    stopRepeatTimer();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    var all = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < all.length; i++) all[i].classList.add('locked');
    btn.classList.remove('locked');
    btn.classList.add('selected');
    answers[currentIndex] = value;
    setTimeout(function(){
      currentIndex++;
      if(currentIndex < questions.length) renderQuestion();
      else showResult();
    }, 350);
  }

  /* ─── RESULT ─── */
  function showResult(){
    stopRepeatTimer();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    elQuiz.style.display = 'none';
    elResult.style.display = 'block';
    var totalScore = 0;
    for(var i = 0; i < answers.length; i++){
      totalScore += answers[i];
    }
    elResultMsg.textContent = '非常感謝您完成了這份調查中所有的問題。請勿關閉此頁面，並告知您的物理治療師。';
    elResultScore.innerHTML = '<span>總計得分: ' + totalScore + ' / 24 分</span>';
    window.scrollTo(0, 0);
playAudio('result.mp3');
  }

  /* ─── RESTART ─── */
  function restart(){
    stopRepeatTimer();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    startQuiz();
  }

  /* ─── INIT ─── */
  function init(){
    if(!speechOK){
      elOverlay.style.display = 'none';
      elBanner.style.display = 'block';
      startQuiz();
    } else {
      window.speechSynthesis.getVoices();
      if(typeof window.speechSynthesis.onvoiceschanged !== 'undefined'){
        window.speechSynthesis.onvoiceschanged = function(){
          window.speechSynthesis.getVoices();
        };
      }
      elOverlay.addEventListener('click', onOverlayTap);
    }
    elReplay.addEventListener('click', function(){
      stopRepeatTimer();
      speakSequence();
    });
    elRestart.addEventListener('click', restart);
  }

  function onOverlayTap(){
    speechEnabled = true;
    elOverlay.style.display = 'none';
    var dummy = new SpeechSynthesisUtterance('');
    dummy.lang = 'zh-HK';
    dummy.volume = 0;
    window.speechSynthesis.speak(dummy);
    startQuiz();
  }

  function startQuiz(){
stopInactivityTimer();
stopAudio();
clearAllGlow();
 
currentIndex = 0;
answers = {};
locked = false;
explanationOpen = false;
 
elResult.style.display = 'none';
elQuiz.style.display = 'flex';
 
renderQuestion();
}

  init();
})();
</script>
</body></html>

  padding:1.6rem 1.2rem 1rem;
  width:100%;max-width:700px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.2rem;
}
#question-number{font-size:1.2rem;color:#999;margin-bottom:.35rem;font-weight:bold;}
#question-text{font-size:2rem;font-weight:bold;line-height:1.75;}

/* ── Button row ── */
.btn-row{
  display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap;
}
.card-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.6rem 1.8rem;
  background:#ececec;color:#555;border:none;border-radius:25px;
  font-size:1.3rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:hover{background:#ddd;}
.card-btn.active{background:#ffeaa7;color:#856404;}
#prev-btn{display:none;background:#dfe6e9;color:#2d3436;}
#prev-btn:hover{background:#b2bec3;}

/* ── Explanation panel (question level) ── */
#explanation-panel{
  display:none;
  background:#fff9e6;border:2px solid #f0d060;border-radius:12px;
  padding:1.2rem 1rem;margin-top:1rem;text-align:left;
  animation:fadeSlideDown .3s ease;
}
@keyframes fadeSlideDown{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}
.explain-text{font-size:1.4rem;line-height:1.8;color:#333;}
.explain-listen-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  margin-top:.8rem;padding:.4rem 1.2rem;
  background:#f0d060;color:#6b5900;border:none;border-radius:20px;
  font-size:1.1rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.explain-listen-btn:hover{background:#e6c340;}

/* ── Answers area ── */
#answers-area{
  width:100%;max-width:700px;
  display:grid;grid-template-columns:1fr;gap:.75rem;
}

/* ── Answer buttons ── */
.answer-btn{
  border:none;border-radius:14px;
  padding:1.5rem 1rem;
  font-size:2rem;font-weight:bold;
  color:#fff;cursor:pointer;
  transition:transform .15s,opacity .15s,box-shadow .3s,filter .3s;
  box-shadow:0 5px 0 rgba(0,0,0,.22);
  text-align:center;user-select:none;
  -webkit-tap-highlight-color:transparent;
  min-height:4.5rem;
  display:flex;align-items:center;justify-content:center;
  gap:0.5rem;position:relative;
}
.answer-btn:active:not(.locked){transform:scale(.96);}
.answer-btn.locked{pointer-events:none;opacity:.35;filter:grayscale(.3);}
.answer-btn.selected{
  transform:scale(1.04);opacity:1!important;filter:none!important;
  box-shadow:0 0 0 5px #fff,0 5px 0 rgba(0,0,0,.22);
}

.answer-btn.glow{
  animation:glowPulse .7s ease-in-out infinite alternate;
  z-index:10;transform:scale(1.04);
}
@keyframes glowPulse{
  0%{
    box-shadow:0 0 12px rgba(255,255,255,0.6),0 0 24px rgba(255,255,255,0.3),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.15);
  }
  100%{
    box-shadow:0 0 24px rgba(255,255,255,1),0 0 48px rgba(255,255,255,0.5),0 0 72px rgba(255,255,255,0.2),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.35);
  }
}

.clr-red{background:#e21b3c;}
.clr-blue{background:#1368ce;}
.btn-emoji{font-size:2.4rem;line-height:1;}

/* ── Result screen ── */
#result-screen{display:none;width:100%;max-width:700px;text-align:center;}
.result-card{
  background:#fff;color:#333;border-radius:16px;
  padding:2rem 1.4rem;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.5rem;
}
.result-msg{font-size:1.6rem;line-height:1.9;margin-bottom:1.8rem;text-align:left;}
.result-scores{font-size:2.4rem;font-weight:bold;color:#1e3d59;}
.result-scores span{display:block;margin:.5rem 0;}
.result-credit{font-size:1rem;color:#aaa;margin-top:1.4rem;}
#restart-btn{
  padding:1.2rem 3rem;background:#17b978;color:#fff;
  border:none;border-radius:30px;font-size:1.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
#restart-btn:hover{background:#129661;}

#quiz-area{width:100%;display:flex;flex-direction:column;align-items:center;}

@media(min-width:600px){
  #question-text{font-size:2.4rem;}
  .answer-btn{font-size:2.2rem;padding:1.8rem 1.2rem;}
  .btn-emoji{font-size:2.8rem;}
  .result-msg{font-size:1.8rem;}
  .result-scores{font-size:2.8rem;}
  .explain-text{font-size:1.6rem;}
}
</style>
</head>
<body>

<div id="speech-overlay">
  <div class="tap-icon">🔊</div>
  <div class="tap-text">點按以啟用語音</div>
  <div class="tap-sub">Tap to enable audio</div>
</div>

<div id="app">
  <div class="header-title">RMDQ腰背痛問卷</div>
  <div class="header-sub">新界東醫院聯網物理治療部</div>

  <div id="quiz-area">
    <div id="progress-area">
      <div id="progress-text"></div>
      <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>
    <div id="question-card">
      <div id="question-number"></div>
      <div id="question-text"></div>
      <div class="btn-row">
        <button class="card-btn" id="prev-btn">⬅️ 返回上一題</button>
        <button class="card-btn" id="replay-btn">🔊 重播</button>
        <button class="card-btn" id="explain-btn">💡 解釋</button>
      </div>
      <div id="explanation-panel">
        <div class="explain-text" id="explain-text"></div>
        <button class="explain-listen-btn" id="explain-listen-btn">🔊 再聽一次解釋</button>
      </div>
    </div>
    <div id="answers-area"></div>
  </div>

  <div id="result-screen">
    <div class="result-card">
      <div class="result-msg" id="result-msg"></div>
      <div class="result-scores" id="result-scores"></div>
      <div class="result-credit">新界東醫院聯網物理治療部製作</div>
    </div>
    <button id="restart-btn">🔄 重新開始</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var questions = [
    { id: 1, text: '因為背痛，我經常留在家中。', explanation: '呢題想問你係咪因為腰痛，成日留喺屋企唔想出街？' },
    { id: 2, text: '我經常轉換姿勢，保持背部舒適。', explanation: '呢題問你為咗條腰舒服啲，係咪需要成日轉坐姿或者企姿？' },
    { id: 3, text: '因為背部，我走得比平常慢。', explanation: '呢題問你行路有冇因為腰痛而比平時慢咗？' },
    { id: 4, text: '因為背部，我已停止做日常負責的家務。', explanation: '呢題問你有冇因為腰痛而停咗去做平時負責嘅家務？' },
    { id: 5, text: '因為背部影響，我上樓梯時要利用扶手。', explanation: '呢題問你行樓梯嗰陣，係咪要扶住扶手先上到去？' },
    { id: 6, text: '因為背部影響，我比平常較多時間躺下休息。', explanation: '呢題問你有冇因為腰痛而比起平時瞓多咗覺或者躺喺床休息？' },
    { id: 7, text: '因為背部影響，我需要扶著東西才能從梳化站起來。', explanation: '呢題問你由梳化起身嗰陣，係咪要扶住嘢先起到身？' },
    { id: 8, text: '因為背部影響，我嘗試請別人替我完成一些事情。', explanation: '呢題問你有冇試過因腰痛而搵其他人幫手做嘢？' },
    { id: 9, text: '因為背部影響，我穿衣比平常緩慢。', explanation: '呢題問你著衫褲嗰陣係咪比平時慢咗？' },
    { id: 10, text: '因為背部影響，我只可站立一段短時間。', explanation: '呢題問你企喺度係咪企得好短時間就會痛？' },
    { id: 11, text: '因為背部影響，我避免彎腰或跪下。', explanation: '呢題問你有冇避開去彎腰或者跪地嘅動作？' },
    { id: 12, text: '因為背部影響，我坐在椅子上很難才能站起。', explanation: '呢題問你坐喺凳上面，起身係咪覺得好困難？' },
    { id: 13, text: '我的背部差不多每時每刻都痛楚。', explanation: '呢題問你係咪幾乎全日、任何時間條腰都有痛楚？' },
    { id: 14, text: '因為背部影響，睡在床上，很難轉身。', explanation: '呢題問你在床上瞓覺嗰陣，想轉身係咪好困難？' },
    { id: 15, text: '因為背部影響，我的胃口不佳。', explanation: '呢題問你有冇因為腰痛而影響到胃口、食唔落飯？' },
    { id: 16, text: '因為背部影響，穿襪子或襪褲時會有困難。', explanation: '呢題問你著襪或者襪褲嗰陣係咪覺得好困難？' },
    { id: 17, text: '因為背痛，我只能走一段短距離。', explanation: '呢題問你行路係咪只行到短距離就要停？' },
    { id: 18, text: '因為背部影響，我睡得不好。', explanation: '呢題問你有冇因為腰痛而影響睡眠質素？' },
    { id: 19, text: '因為背痛，我需要別人協助穿衣服。', explanation: '呢題問你著衫係咪需要其他人幫手？' },
    { id: 20, text: '因為背部影響，我每天大部份時間都是坐著。', explanation: '呢題問你一日之內係咪大部分時間都坐喺度？' },
    { id: 21, text: '因為背部影響，我避免做家中粗重的工作。', explanation: '呢題問你有冇避開屋企比較重嘅粗重工夫？' },
    { id: 22, text: '因為背痛，我的脾氣比平常差。', explanation: '呢題問你有冇因為腰痛而搞到脾氣比平時暴躁？' },
    { id: 23, text: '因為背部影響，我上樓梯比平常緩慢。', explanation: '呢題問你行樓梯嘅速度係咪比平時慢？' },
    { id: 24, text: '因為背部影響，我大部份時間睡在床上。', explanation: '呢題問你係咪大部分時間都瞓在床上？' }
  ];

  var currentIndex   = 0;
  var answers        = {};
  var locked         = false;
  var audioEnabled   = false;
  var explanationOpen= false;
  var currentAudio   = null;
  var inactivityTimer = null;
  var audioSequenceId = 0;

  /* ═══════════════════ AUDIO FUNCTIONS (FLAT ROOT DIRECTORY) ═══════════════════ */
  function clearAllGlow(){
    var btns = document.querySelectorAll('.answer-btn');
    for(var i = 0; i < btns.length; i++){
      btns[i].classList.remove('glow');
    }
  }

  function stopInactivityTimer(){
    if(inactivityTimer !== null){
      clearTimeout(inactivityTimer);
      inactivityTimer = null;
    }
  }

  function startInactivityTimer(){
    stopInactivityTimer();
    inactivityTimer = setTimeout(function(){
      inactivityTimer = null;
      if(!locked && !explanationOpen){
        playQuestionAudio();
      }
    }, 20000);
  }

  function stopAudio(){
    audioSequenceId++;
    if(currentAudio){
      currentAudio.onended = null;
      currentAudio.onerror = null;
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    clearAllGlow();
  }

  function playAudio(file, onEndedCb){
    stopAudio();
    stopInactivityTimer();

    if(!audioEnabled){
        if(onEndedCb){
            onEndedCb();
        }
        return;
    }

    var finished = false;

    currentAudio = new Audio(file);

    function finishAudio(errorMessage, error){
        if(finished){
            return;
        }

        finished = true;

        if(errorMessage){
            console.log(errorMessage, file, error || '');
        }

        currentAudio = null;

        if(onEndedCb){
            onEndedCb();
        }
    }

    currentAudio.onended = function(){
        finishAudio();
    };

    currentAudio.onerror = function(){
        finishAudio('無法載入音訊檔案：');
    };

    currentAudio.play().catch(function(error){
        finishAudio('播放被阻擋或出錯：', error);
    });
}

  function playAudioSequence(files){
    stopAudio();
    stopInactivityTimer();

    if(!audioEnabled) return;

    var index = 0;
var mySequenceId = audioSequenceId;
var sequenceQuestionIndex = currentIndex;
    
    function next(){
     if(
    mySequenceId !== audioSequenceId ||
    sequenceQuestionIndex !== currentIndex
){
    return;
}
      if(locked || explanationOpen){
        clearAllGlow();
        return;
      }

      if(index >= files.length){
        clearAllGlow();
        currentAudio = null;
        startInactivityTimer();
        return;
      }

      clearAllGlow();

      // index 0: 題目, index 1: 同意 (agree.mp3), index 2: 不同意 (disagree.mp3)
      if(index > 0){
        var answerBtns = document.querySelectorAll('.answer-btn');
        var btnIndex = index - 1;
        if(answerBtns[btnIndex]){
          answerBtns[btnIndex].classList.add('glow');
        }
      }

      var file = files[index];
      var clipFinished = false;

      currentAudio = new Audio(file);

      function finishClip(errorMessage){
        if(clipFinished) return;
        clipFinished = true;

        if(mySequenceId !== audioSequenceId) return;

        if(errorMessage){
          console.log(errorMessage, file);
        }

        clearAllGlow();
        currentAudio = null;
        index++;

        setTimeout(function(){
          if(mySequenceId === audioSequenceId){
            next();
          }
        }, 300);
      }

      currentAudio.onended = function(){
        finishClip();
      };

      currentAudio.onerror = function(){
        finishClip('Missing audio:');
      };

      currentAudio.play().catch(function(error){
        console.log('Playback error:', file, error);
        finishClip('Unable to play audio:');
      });
    }

    next();
  }

  function playQuestionAudio(){
    if(currentIndex < 0 || currentIndex >= questions.length) return;

    var qNo = currentIndex + 1;
    var files = [];

// GitHub root files: q1.mp3, agree.mp3 and disagree.mp3    files.push('q' + qNo + '.mp3');
    files.push('agree.mp3');
    files.push('disagree.mp3');

    playAudioSequence(files);
  }

  /* ═══════════════════ DOM REFS ═══════════════════ */
  var elOverlay      = document.getElementById('speech-overlay');
  var elProgressTxt  = document.getElementById('progress-text');
  var elProgressBar  = document.getElementById('progress-bar-fill');
  var elQNum         = document.getElementById('question-number');
  var elQText        = document.getElementById('question-text');
  var elPrevBtn      = document.getElementById('prev-btn');
  var elReplay       = document.getElementById('replay-btn');
  var elExplainBtn   = document.getElementById('explain-btn');
  var elExplainPanel = document.getElementById('explanation-panel');
var elExplainText  = document.getElementById('explain-text');
var elExplainListen= document.getElementById('explain-listen-btn');
  var elAnswers      = document.getElementById('answers-area');
  var elQuiz         = document.getElementById('quiz-area');
  var elResult       = document.getElementById('result-screen');
  var elResultMsg    = document.getElementById('result-msg');
  var elResultScore  = document.getElementById('result-scores');
  var elRestart      = document.getElementById('restart-btn');

  function openExplanation(){
    stopInactivityTimer();
    clearAllGlow();
    explanationOpen = true;
    elExplainPanel.style.display = 'block';
    elExplainBtn.classList.add('active');

    var qNo = currentIndex + 1;
// GitHub root file example: q1 explain.mp3    playAudio('q' + qNo + ' explain.mp3');
  }

  function closeExplanation(){
    explanationOpen = false;
    elExplainPanel.style.display = 'none';
    elExplainBtn.classList.remove('active');
  }

  function toggleExplanation(){
    if(explanationOpen){
      closeExplanation();
      stopAudio();
      setTimeout(function(){
        playQuestionAudio();
      }, 100);
    } else {
      openExplanation();
    }
  }

  function renderQuestion(){
    stopInactivityTimer();
    stopAudio();
    clearAllGlow();

    locked = false;
    explanationOpen = false;

    if(
        currentIndex < 0 ||
        currentIndex >= questions.length
    ){
        return;
    }

    var q = questions[currentIndex];

    elProgressTxt.textContent =
    '第 ' + (currentIndex + 1) +
    ' / ' + questions.length + ' 題';

elProgressBar.style.width =
    (
        (currentIndex + 1) /
        questions.length *
        100
    ) + '%';
    elQNum.textContent = '問題 ' + (currentIndex + 1);
    elQText.textContent = q.text;

    if(currentIndex > 0){
      elPrevBtn.style.display = 'inline-flex';
    } else {
      elPrevBtn.style.display = 'none';
    }

    elExplainPanel.style.display = 'none';
    elExplainBtn.classList.remove('active');
    elExplainText.textContent = q.explanation;

    elAnswers.innerHTML = '';

    var prevVal = answers[currentIndex];

    addButton('✅', '同意', 1, 'clr-red', prevVal === 1);
    addButton('❌', '不同意', 0, 'clr-blue', prevVal === 0);

    window.scrollTo(0, 0);
    playQuestionAudio();
  }

  function addButton(emoji, label, value, colorClass, isSelected){
    var btn = document.createElement('button');
    btn.className = 'answer-btn ' + colorClass;
    if(isSelected){
      btn.classList.add('selected');
    }
    if(emoji){
      var es = document.createElement('span');
      es.className = 'btn-emoji';
      es.textContent = emoji;
      btn.appendChild(es);
    }
    var ts = document.createElement('span');
    ts.textContent = label;
    btn.appendChild(ts);
    btn.addEventListener('click', function(){ onAnswer(btn, value); });
    elAnswers.appendChild(btn);
  }

  function onAnswer(btn, value){
    stopInactivityTimer();
    if(locked) return;
    locked = true;
    stopAudio();

    var all = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < all.length; i++) all[i].classList.add('locked');
    btn.classList.remove('locked');
    btn.classList.add('selected');

    answers[currentIndex] = value;

    setTimeout(function(){
      currentIndex++;
      if(currentIndex < questions.length) renderQuestion();
      else showResult();
    }, 350);
  }

  function prevQuestion(){
    stopInactivityTimer();
    clearAllGlow();
    if(currentIndex <= 0) return;
    stopAudio();
    currentIndex--;
    renderQuestion();
  }

  function showResult(){
    stopInactivityTimer();
    stopAudio();
    elQuiz.style.display = 'none';
    elResult.style.display = 'block';

    var totalScore = 0;
    for(var key in answers){
      if(answers.hasOwnProperty(key)){
        totalScore += (answers[key] || 0);
      }
    }

    elResultMsg.textContent =
      '非常感謝您完成了這份調查中所有的問題。' +
      '請勿關閉此頁面，並告知您的物理治療師。';

    elResultScore.innerHTML =
     '<span>總得分: ' +
totalScore +
' / ' +
questions.length +
'</span>'

    window.scrollTo(0, 0);
  }

 function restart(){
    stopInactivityTimer();
    stopAudio();
    clearAllGlow();
    startQuiz();
}

  function init(){
    elOverlay.addEventListener('click', onOverlayTap);
    elPrevBtn.addEventListener('click', prevQuestion);
    elReplay.addEventListener('click', function(){
      stopInactivityTimer();
      closeExplanation();
      playQuestionAudio();
    });
    elExplainBtn.addEventListener('click', function(){
      toggleExplanation();
    });
    elExplainListen.addEventListener('click', function(){
      stopInactivityTimer();
      var qNo = currentIndex + 1;
      // 根據你的 GitHub 根目錄結構：q1 explain.mp3[cite: 12]
      playAudio('q' + qNo + ' explain.mp3');
    });
    elRestart.addEventListener('click', restart);
  }

  function onOverlayTap(){
    audioEnabled = true;
    elOverlay.style.display = 'none';
    startQuiz();
  }

  function startQuiz(){
    currentIndex = 0;
    answers = {};
    elResult.style.display = 'none';
    elQuiz.style.display = 'flex';
    renderQuestion();
  }

  init();
})();
</script>
</body>
</html>
